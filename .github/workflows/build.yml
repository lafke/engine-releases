name: Build

# Builds the engine from the main branch of the private lafke/engine repository for
# every release platform, so a broken build is found before a release is cut.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { goos: darwin, goarch: amd64, runner: macos-latest, target: x86_64-apple-darwin }
          - { goos: darwin, goarch: arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { goos: windows, goarch: amd64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { goos: windows, goarch: arm64, runner: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lafke/engine
          path: engine
          token: ${{ secrets.ENGINE_ACCESS_TOKEN }}
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          key: ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          RULEPACK_PUBLIC_KEY: ${{ secrets.RULEPACK_PUBLIC_KEY }}
          RULEPACK_DECRYPTION_KEY: ${{ secrets.RULEPACK_DECRYPTION_KEY }}
        run: sh scripts/package.sh ${{ matrix.goos }} ${{ matrix.goarch }} dev
      - name: Smoke test
        env:
          RULEPACK_DECRYPTION_KEY: ${{ secrets.RULEPACK_DECRYPTION_KEY }}
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          mkdir smoke && tar -xzf dist/lafke-engine_linux_amd64.tar.gz -C smoke
          smoke/lafke-engine version
          (cd engine && bash scripts/verify-release.sh ../smoke/lafke-engine dev)
