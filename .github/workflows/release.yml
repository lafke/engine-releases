name: Release

# Builds the engine from the private lafke/engine repository and publishes the
# binaries here, so the executables carry a public provenance attestation. Triggered by
# the release workflow in lafke/engine when it pushes a v* tag. The release is created
# as a draft with every asset attached, then published only after all attestations have
# succeeded, so /releases/latest never points at an unattested release.
on:
  repository_dispatch:
    types: [engine-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of lafke/engine to release
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the tag is a version and points at main in the engine
        env:
          GH_TOKEN: ${{ secrets.ENGINE_ACCESS_TOKEN }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid tag: $TAG" >&2; exit 1 ;;
          esac
          engine_tag=$(gh api "repos/lafke/engine/commits/${TAG}" --jq .sha)
          engine_main=$(gh api repos/lafke/engine/commits/main --jq .sha)
          if [ "$engine_tag" != "$engine_main" ]; then
            echo "$TAG must point at the current main commit of lafke/engine." >&2
            echo "tag:  $engine_tag" >&2
            echo "main: $engine_main" >&2
            exit 1
          fi

  package:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lafke/engine
          path: engine
          ref: ${{ env.TAG }}
          token: ${{ secrets.ENGINE_ACCESS_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Package
        run: sh scripts/package.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lafke/engine
          path: engine
          ref: ${{ env.TAG }}
          token: ${{ secrets.ENGINE_ACCESS_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lafke/lafke
          path: cli
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: SPDX SBOM
        run: |
          (cd cli && go build -o "$RUNNER_TEMP/lafke" ./cmd/lafke)
          export SOURCE_DATE_EPOCH=$(git -C engine log -1 --format=%ct)
          mkdir dist
          "$RUNNER_TEMP/lafke" lock engine --offline --no-fail
          "$RUNNER_TEMP/lafke" sbom export engine --spec spdx --offline > dist/lafke-engine.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error

  draft:
    needs: [package, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Manifest
        run: |
          mkdir probe
          tar -xzf dist/lafke-engine_linux_amd64.tar.gz -C probe
          protocol=$(probe/lafke-engine version | jq -r .protocol)
          sh scripts/manifest.sh dist "$TAG" "$protocol"
      - name: Checksums
        working-directory: dist
        run: sha256sum lafke-engine* engine-manifest.json > checksums.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "$TAG" \
            --notes "lafke-engine ${TAG}, built from the private lafke/engine repository." \
            --draft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  attest:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Extract binaries
        run: |
          for a in dist/*.tar.gz; do
            d="bin/$(basename "$a" .tar.gz)"; mkdir -p "$d"; tar -xzf "$a" -C "$d"
          done
          for a in dist/*.zip; do
            d="bin/$(basename "$a" .zip)"; mkdir -p "$d"; unzip -q "$a" -d "$d"
          done
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/engine-manifest.json
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            bin/*/lafke-engine
            bin/*/lafke-engine.exe
      - name: Attest engine SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            bin/*/lafke-engine
            bin/*/lafke-engine.exe
          sbom-path: dist/lafke-engine.spdx.json

  publish:
    needs: [draft, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
